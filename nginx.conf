# Nginx frontal : seul point d'entrée de l'application.
# L'adresse du client est transmise à Django dans X-Forwarded-For : elle sert au filtrage par plage IP.

upstream appli { server web:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 3m;          # import CSV des locaux
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Passage en HTTPS : décommenter cette ligne et activer conf.d/https.conf (voir docs/INSTALLATION.md)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://appli;
        proxy_set_header Host $http_host;      # conserve le port : nécessaire au contrôle CSRF si PORT_HTTP ≠ 80
        # $remote_addr et non $proxy_add_x_forwarded_for : on écrase l'en-tête éventuellement envoyé par le poste client
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
